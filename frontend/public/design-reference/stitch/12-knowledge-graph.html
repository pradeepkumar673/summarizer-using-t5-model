<style>
        /* Tactile / Sketchbook styles */
        .wobbly-border {
            border: 2px solid #1c1b1b;
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
        }
        .wobbly-border-thick {
            border: 3px solid #1c1b1b;
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
        }
        .torn-edge-bottom {
            border-bottom: 2px dashed #1c1b1b;
            position: relative;
        }
        .torn-edge-bottom::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent 50%, #fcf9f8 50%);
            background-size: 8px 100%;
        }
        .grid-bg {
            background-image: 
                linear-gradient(to right, #e5e2e1 1px, transparent 1px),
                linear-gradient(to bottom, #e5e2e1 1px, transparent 1px);
            background-size: 20px 20px;
        }
        
        /* Line drawing SVG paths for the graph */
        .hand-drawn-line {
            stroke: #1c1b1b;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(1px 1px 0px rgba(0,0,0,0.1));
        }
        .marker-highlight {
            stroke: #005da7; /* Primary blue wash */
            stroke-width: 8;
            fill: none;
            stroke-linecap: round;
            opacity: 0.4;
        }

        /* Blob shapes for nodes */
        .blob-1 { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
        .blob-2 { border-radius: 50% 50% 30% 70% / 50% 40% 60% 50%; }
        .blob-3 { border-radius: 30% 70% 50% 50% / 60% 30% 70% 40%; }
        .blob-4 { border-radius: 60% 40% 60% 40% / 40% 60% 40% 60%; }

        .stacked-paper {
            box-shadow: 2px 2px 0 0 #1c1b1b;
        }

        /* Hide scrollbar */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col md:flex-row overflow-hidden">
<!-- Mobile Top Bar (Hidden on md) -->
<header class="md:hidden flex justify-between items-center w-full px-margin-mobile h-16 z-50 bg-surface border-b-[3px] border-on-surface">
<div class="font-headline-md text-headline-md text-primary italic">pradeepLLM</div>
<div class="flex gap-2">
<span class="material-symbols-outlined text-primary">account_circle</span>
</div>
</header>
<!-- Main Canvas Area -->
<main class="flex-1 relative overflow-hidden grid-bg z-10 cursor-move">
<!-- SVG Connections Layer (Behind nodes) -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" xmlns="http://www.w3.org/2000/svg">
<defs>
<filter id="roughness">
<feturbulence basefrequency="0.04" numoctaves="3" result="noise" type="fractalNoise"></feturbulence>
<fedisplacementmap in="SourceGraphic" in2="noise" scale="3" xchannelselector="R" ychannelselector="G"></fedisplacementmap>
</filter>
</defs>
<!-- Line: ML to Supervised -->
<path class="hand-drawn-line" d="M 400 300 Q 300 250 250 200" filter="url(#roughness)"></path>
<text fill="#414751" font-family="'JetBrains Mono'" font-size="12" transform="rotate(-35 310 240)" x="310" y="240">includes</text>
<!-- Line: ML to Unsupervised -->
<path class="hand-drawn-line" d="M 400 300 Q 550 250 600 200" filter="url(#roughness)"></path>
<text fill="#414751" font-family="'JetBrains Mono'" font-size="12" transform="rotate(25 500 240)" x="500" y="240">includes</text>
<!-- Line: Supervised to Classification (HIGHLIGHTED) -->
<path class="marker-highlight" d="M 250 200 Q 150 280 180 380" filter="url(#roughness)"></path>
<path class="hand-drawn-line" d="M 250 200 Q 150 280 180 380" filter="url(#roughness)"></path>
<text fill="#414751" font-family="'JetBrains Mono'" font-size="12" transform="rotate(75 180 280)" x="180" y="280">is a type of</text>
<!-- Line: Supervised to Regression -->
<path class="hand-drawn-line" d="M 250 200 Q 280 100 350 120" filter="url(#roughness)"></path>
<!-- Line: Unsupervised to Clustering -->
<path class="hand-drawn-line" d="M 600 200 Q 700 280 650 380" filter="url(#roughness)"></path>
</svg>
<!-- Nodes Layer -->
<div class="absolute inset-0 w-full h-full pointer-events-none">
<!-- Central Node -->
<div class="absolute top-[280px] left-[350px] w-32 h-32 bg-white wobbly-border blob-1 flex items-center justify-center p-4 text-center transform -rotate-2 hover:bg-primary/10 transition-colors pointer-events-auto cursor-pointer stacked-paper">
<span class="font-headline-sm text-headline-sm text-on-surface">Machine Learning</span>
</div>
<!-- Supervised Node -->
<div class="absolute top-[160px] left-[180px] w-28 h-28 bg-white wobbly-border blob-2 flex items-center justify-center p-4 text-center transform rotate-3 hover:bg-primary/10 transition-colors pointer-events-auto cursor-pointer">
<span class="font-body-lg text-body-lg text-on-surface">Supervised Learning</span>
</div>
<!-- Unsupervised Node -->
<div class="absolute top-[160px] left-[550px] w-28 h-28 bg-white wobbly-border blob-3 flex items-center justify-center p-4 text-center transform -rotate-1 hover:bg-primary/10 transition-colors pointer-events-auto cursor-pointer">
<span class="font-body-lg text-body-lg text-on-surface">Unsupervised Learning</span>
</div>
<!-- Classification Node -->
<div class="absolute top-[350px] left-[120px] w-24 h-24 bg-white wobbly-border blob-4 flex items-center justify-center p-4 text-center transform rotate-6 hover:bg-primary/10 transition-colors pointer-events-auto cursor-pointer">
<span class="font-body-md text-body-md text-on-surface">Classification</span>
</div>
<!-- Regression Node -->
<div class="absolute top-[80px] left-[320px] w-24 h-24 bg-white wobbly-border blob-1 flex items-center justify-center p-4 text-center transform -rotate-4 hover:bg-primary/10 transition-colors pointer-events-auto cursor-pointer">
<span class="font-body-md text-body-md text-on-surface">Regression</span>
</div>
<!-- Clustering Node -->
<div class="absolute top-[350px] left-[600px] w-24 h-24 bg-white wobbly-border blob-2 flex items-center justify-center p-4 text-center transform rotate-2 hover:bg-primary/10 transition-colors pointer-events-auto cursor-pointer">
<span class="font-body-md text-body-md text-on-surface">Clustering</span>
</div>
</div>
<!-- Evidence Popup (Floating near highlighted edge) -->
<div class="absolute top-[280px] left-[200px] w-64 bg-surface wobbly-border-thick p-4 transform rotate-1 stacked-paper z-20">
<div class="font-source-code text-source-code text-on-surface-variant mb-4 torn-edge-bottom pb-2">
                "Classification is a supervised learning approach in which the computer program learns from the data input given to it..."
            </div>
<div class="flex justify-end">
<button class="wobbly-border w-8 h-8 rounded-full flex items-center justify-center hover:bg-primary/20 transition-colors group" title="View in PDF">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform text-sm">menu_book</span>
</button>
</div>
</div>

<div class="absolute top-4 left-4 text-on-surface-variant/30 font-label-caps text-label-caps">Page 42</div>
<div class="absolute bottom-4 left-4 text-on-surface-variant/30 transform -rotate-12">
