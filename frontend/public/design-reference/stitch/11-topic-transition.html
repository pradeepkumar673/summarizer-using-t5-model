<style>
        /* Wobbly lines for the "Scholar's Sketchbook" aesthetic */
        .wobbly-border {
            border: 2px solid #1c1b1b;
            border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
        }
        .wobbly-border-bottom {
            border-bottom: 2px solid #1c1b1b;
            border-bottom-left-radius: 255px 15px;
            border-bottom-right-radius: 15px 255px;
        }
        
        .torn-paper {
            position: relative;
            background: #ffffff;
            border: 2px solid #1c1b1b;
        }
        .torn-paper::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: -2px;
            right: -2px;
            height: 6px;
            background-image: url("data:image/svg+xml,%3Csvg width='100%25' height='100%25' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0,0 L0,2 Q10,6 20,2 T40,2 T60,2 T80,2 T100,2 L100,0 Z' fill='%23ffffff' stroke='%231c1b1b' stroke-width='2'/%3E%3C/svg%3E");
            background-repeat: repeat-x;
        }

        .highlight-mustard {
            background: linear-gradient(104deg, rgba(254, 174, 44, 0) 0.9%, rgba(254, 174, 44, 1.25) 2.4%, rgba(254, 174, 44, 0.5) 5.8%, rgba(254, 174, 44, 0.1) 93%, rgba(254, 174, 44, 0.7) 96%, rgba(254, 174, 44, 0) 98%), linear-gradient(183deg, rgba(254, 174, 44, 0) 0%, rgba(254, 174, 44, 0.3) 7.9%, rgba(254, 174, 44, 0) 15%);
        }
        
        .highlight-blue {
            background: linear-gradient(104deg, rgba(0, 93, 167, 0) 0.9%, rgba(0, 93, 167, 0.25) 2.4%, rgba(0, 93, 167, 0.5) 5.8%, rgba(0, 93, 167, 0.1) 93%, rgba(0, 93, 167, 0.7) 96%, rgba(0, 93, 167, 0) 98%), linear-gradient(183deg, rgba(0, 93, 167, 0) 0%, rgba(0, 93, 167, 0.3) 7.9%, rgba(0, 93, 167, 0) 15%);
        }

        .hand-drawn-arrow {
            position: relative;
            display: inline-block;
            width: 24px;
            height: 24px;
        }
        .hand-drawn-arrow::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #1c1b1b;
            transform: translateY(-50%) rotate(2deg);
        }
        .hand-drawn-arrow::after {
            content: '';
            position: absolute;
            top: 50%;
            right: 0;
            width: 8px;
            height: 8px;
            border-top: 2px solid #1c1b1b;
            border-right: 2px solid #1c1b1b;
            transform: translateY(-50%) rotate(45deg);
        }
    </style>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-lg font-body-md text-on-background">
<!-- Container for context (simulating the scrollable list) -->
<div class="w-full max-w-2xl flex flex-col gap-lg items-center">
<!-- Placeholder Note Card Above -->
<div class="w-full bg-surface-container wobbly-border p-md rotate-[-1deg] opacity-60">
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-sm">Supervised Learning Overview</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Notes on fundamental concepts...</p>
</div>
<!-- Topic Transition Card -->
<div class="relative w-11/12 max-w-xl mx-auto flex items-center justify-between p-sm px-md torn-paper rotate-[1deg] shadow-[2px_2px_0px_rgba(28,27,27,1)] z-10 my-md hover:-translate-y-1 hover:rotate-0 transition-transform duration-300">
<!-- Icon/Signpost Left -->
<div class="flex-shrink-0 mr-md border-r-2 border-on-surface pr-sm wobbly-border-bottom border-b-0 border-l-0 border-t-0">
<span class="material-symbols-outlined text-primary text-3xl font-bold" data-icon="explore" data-weight="fill" style="font-variation-settings: 'FILL' 1;">explore</span>
</div>
<!-- Content Container -->
<div class="flex-grow flex flex-col md:flex-row items-center justify-between gap-sm text-center md:text-left overflow-hidden">
<!-- Previous -->
<div class="flex flex-col items-center md:items-start shrink">
<span class="font-label-caps text-label-caps text-on-surface-variant mb-xs opacity-70">Previous</span>
<span class="font-source-code text-source-code text-on-surface highlight-mustard px-1 rounded-sm">Supervised Learning</span>
</div>
<!-- Arrow 1 -->
<div class="hidden md:block hand-drawn-arrow mx-xs shrink-0"></div>
<div class="md:hidden w-px h-4 bg-on-surface wobbly-border mx-auto my-xs"></div>
<!-- Now -->
<div class="flex flex-col items-center md:items-center grow relative">
<div class="absolute -top-3 -left-2 w-full h-full bg-secondary-container/20 wobbly-border rotate-[-2deg] -z-10"></div>
<span class="font-label-caps text-label-caps text-primary mb-xs">Now</span>
<span class="font-headline-sm text-headline-sm text-on-surface font-bold leading-tight">Classification Algorithms</span>
</div>
<!-- Arrow 2 -->
<div class="hidden md:block hand-drawn-arrow mx-xs shrink-0"></div>
<div class="md:hidden w-px h-4 bg-on-surface wobbly-border mx-auto my-xs"></div>
<!-- Next -->
<div class="flex flex-col items-center md:items-end shrink text-right">
<span class="font-label-caps text-label-caps text-on-surface-variant mb-xs opacity-70">Next</span>
<span class="font-source-code text-source-code text-on-surface highlight-blue px-1 rounded-sm">Decision Trees</span>
</div>
</div>
<!-- Decorative Tape Top Right -->
<div class="absolute -top-2 -right-3 w-10 h-4 bg-surface-variant wobbly-border rotate-12 z-20"></div>
</div>
<!-- Placeholder Note Card Below -->
<div class="w-full bg-surface-container wobbly-border p-md rotate-[1.5deg] opacity-60">
<h3 class="font-headline-sm text-headline-sm text-on-surface mb-sm">Decision Trees Setup</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Initial thoughts on structure...</p>
</div>
</div>
</body></html>
